# robot_localization configuration
#
# Fuses:
#   - /wheel_odom   (nav_msgs/Odometry, twist-only, from wheel_odometry_node)
#       -> forward velocity (vx)
#   - /imu          (sensor_msgs/Imu, RAW Septentrio external-sensor gyro/accel,
#                    NOT /insnavgeod, which is already GPS-fused)
#       -> yaw rate only (angular_velocity.z). We deliberately do NOT feed in
#          the IMU orientation field here, since that field is itself derived
#          from the INS's internal GNSS fusion - using it here in addition to
#          fusing raw GPS via navsat_transform would double count GPS
#          information and violate the EKF's sensor-independence assumption.
#   - /odometry/gps (nav_msgs/Odometry, from navsat_transform_node)
#       -> absolute x, y position anchor, so this local odom/map frame lines
#          up with the real world (and across separate launches), instead of
#          drifting/resetting like pure wheel+IMU dead reckoning would.
#
# NOTE: because we don't fuse an absolute yaw source, heading is obtained by
# integrating the raw IMU yaw rate only, and WILL slowly drift over a long
# session. If you find heading drift is a problem, you can additionally
# enable the imu0 orientation (yaw) channel below - just be aware it
# reintroduces the GPS-correlation caveat described above.

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    odom0: /wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10

    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10

navsat_transform:
  ros__parameters:
    frequency: 10.0
    delay: 3.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_utm_transform: false
    publish_filtered_gps: false
    # Use the EKF's own fused yaw (from IMU angular-rate integration) to
    # rotate GPS lat/lon into the local frame, instead of the IMU's
    # orientation field (which would be GNSS-derived) or /insnavgeod heading.
    use_odometry_yaw: true
    wait_for_datum: false
